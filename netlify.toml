[build]
  command = "node build.js"
  publish = "dist"
  # Salta el build si el commit no toca nada que llegue a la web (workflows, pruebas, README, estado de enlaces…)
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- content/ public/ locales/ netlify/ scripts/ build.js netlify.toml package.json package-lock.json"
# Vistas previas de ramas y pull requests: desactivadas para ahorrar créditos (cada una gastaba un despliegue)
[context.deploy-preview]
  ignore = "exit 0"
  command = "SYNC_AUTHORS=0 node build.js"
[context.branch-deploy]
  ignore = "exit 0"
  command = "SYNC_AUTHORS=0 node build.js"

[functions]
  directory = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
