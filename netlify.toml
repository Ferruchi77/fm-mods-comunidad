[build]
  command = "node build.js"
  publish = "dist"
# Vistas previas de ramas y pull requests (flujo editorial del panel): no escriben archivos en el repositorio
[context.deploy-preview]
  command = "SYNC_AUTHORS=0 node build.js"
[context.branch-deploy]
  command = "SYNC_AUTHORS=0 node build.js"

[functions]
  directory = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
