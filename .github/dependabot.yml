# Dependabot: abre una PR cuando salga una versión nueva de las acciones de GitHub que usan los workflows
# (así no vuelve a aparecer el aviso de «Node.js obsoleto»). El proyecto no tiene dependencias npm de build.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencias]
