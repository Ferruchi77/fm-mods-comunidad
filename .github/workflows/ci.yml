# Comprobaciones automáticas en cada cambio: pruebas + compilación estricta (falla si faltan claves de idioma o hay categorías inexistentes).
# Las traducciones pendientes NO hacen fallar nada (se avisan en el issue «Traducciones pendientes»).
name: Comprobar
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save --no-package-lock sharp   # para la prueba de descarga/WebP de scripts/imagenes.js
      - run: node --test tests/*.test.js tests/*.test.mjs
      - run: node scripts/imagenes.js --check          # ninguna ficha apunta a una imagen local inexistente
      - name: Compilar en modo estricto
        env:
          STRICT: '1'
          SYNC_AUTHORS: '0'
          NO_STATS_FETCH: '1'
          OUT_DIR: ${{ runner.temp }}/dist
        run: node build.js
